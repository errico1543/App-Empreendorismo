<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estuda+ | Organize seus estudos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="student-panel">
            <p style="font-size: 32px; line-height: 10px; font-weight: bold;">Bem-vindo, Erick!</p>
            <p style="font-size: 24px;">Série: 8º Ano</p>
            <!--Tasks displays here-->
            <hr style="background-color: white; color: white; width: 100%;">
            <p style="font-weight: 500; font-size: 24px;">Suas tarefas</p>
            <div style="display: flex; flex-direction: row; gap: 15px;">
                <div id="pendente-numero" class="task-display" style="background-color: rgba(91, 69, 36); color: rgba(249, 204, 111);">
                     <p style="font-size: 24px;">Tarefas Pendentes
                     </p><p id="pendenteID" style="font-size: 32px;">1</p>
                </div>
                <div id="emAndamento-numero" class="task-display" style="background-color: rgba(35, 75, 112); color: rgba(141, 202, 255);"> 
                    <p style="font-size: 24px;">Tarefas sendo feitas</p>
                    <p id="emAndamentoID" style="font-size: 32px;">2</p>
                </div>
                <div id="feito-numero" class="task-display" style="background-color: rgba(36, 91, 64); color: rgba(140, 236, 174);"> 
                    <p style="font-size: 24px;">Tarefas Completas</p>
                    <p id="feitoID" style="font-size: 32px;">3</p>
                </div>
            </div>
        </div>
    </header>

    <main>
        <h1>Suas tarefas</h1>
        

<div id="adicionar-tarefa">
    <input
        type="text"
        id="nome-tarefa"
        placeholder="Nome da tarefa..."
    >

    <label for="prazo-tarefa">Prazo (opcional):</label>
    <input
        type="date"
        id="prazo-tarefa"
    >

    <button id="adicionar-btn">Adicionar tarefa</button>
</div>


        <div id="Tarefas">
            <div class="task">
    <h2 class="task-title">Eu sou um cartão!</h2>
    <p class="task-status">Em andamento</p>
</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
