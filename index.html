<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site</title>
    <style>
        html {
            justify-content: center;
            text-align: center;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
    </style>
</head>
<body style="align-items: center;  justify-content: center;">
    <h1 style="color: green;">Organizador de datas escolares</h1>
    <h2 style="color: blue;">Provas</h2>
    <div id="quadroprovas"></div>
    <h2 style="color: rgb(255, 0, 0);">Tarefas</h2>
    <div id="quadrotarefas"></div>


    <h2>adicionar provas</h2>
    <input type="text" value="Prova de 'Insira matéria aqui' [Insira Data Aqui]" style="width: 400px; font-size: 18px;" id="addprova">
    <button id="enviar" onclick="enviarprova()">Inserir Prova</button>
    <img src="/dashboard_infographic.jpg" alt="Dashboard_infographic.jpg" height="100px" width="200px" style="justify-content: center; text-align: center;">
</body>

<script>
    const quadroprovas = document.getElementById("quadroprovas");
    const quadrotarefas = document.getElementById("quadrotarefas");
    const enviar = document.getElementById("enviar");
    const addprova = document.getElementById("addprova");


    function enviarprova() {
        const addprovavalue = addprova.value;
        const novaprova = document.createElement("p");
        novaprova.textContent = addprovavalue;
        quadroprovas.appendChild(novaprova);
    }
</script>
</html>
